<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__MSG_optionsTitle__</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --border: #e6e8ef;
      --text: #1f2430;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --danger: #dc2626;
      --ok: #059669;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    header { margin-bottom: 22px; }
    .logo {
      font-size: 24px; font-weight: 700; letter-spacing: .5px;
      display: flex; align-items: center; gap: 10px;
    }
    .logo::before {
      content: ""; width: 12px; height: 30px; border-radius: 6px;
      background: linear-gradient(180deg, #6366f1, #8b5cf6); display: inline-block;
    }
    .sub { color: var(--muted); margin: 8px 0 0; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px 22px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(16,24,40,.04);
    }
    .card h2 { margin: 0 0 16px; font-size: 15px; font-weight: 700; color: #111827; }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #374151; }
    .hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
    input[type="text"], input[type="password"], textarea {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 9px;
      font-size: 14px; font-family: inherit; color: var(--text); background: #fff;
      outline: none; transition: border-color .12s ease, box-shadow .12s ease;
    }
    input[type="text"]:focus, input[type="password"]:focus, textarea:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }
    textarea { resize: vertical; min-height: 84px; line-height: 1.55; }
    .keywrap { display: flex; gap: 8px; }
    .keywrap input { flex: 1; }
    button {
      font-family: inherit; font-size: 14px; cursor: pointer; border-radius: 9px;
      border: 1px solid var(--border); background: #fff; color: #374151;
      padding: 8px 16px; transition: all .12s ease; white-space: nowrap;
    }
    button:hover { background: #f3f4f6; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
    button.primary:hover { background: var(--accent-hover); }
    button.ghost { background: transparent; }
    code {
      background: #eef0f6; color: #4338ca; padding: 1px 6px; border-radius: 5px;
      font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px;
    }
    .footer {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px;
    }
    .test-status { font-size: 13px; color: var(--muted); min-height: 20px; }
    details.providers { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; }
    summary { cursor: pointer; color: var(--muted); font-size: 13px; user-select: none; }
    details pre {
      background: #f8f9fc; border: 1px solid var(--border); border-radius: 9px;
      padding: 12px 14px; overflow-x: auto; font-size: 12px; line-height: 1.7;
      font-family: "SF Mono", Menlo, Consolas, monospace; color: #374151;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">__MSG_extName__</div>
      <p class="sub">__MSG_headerSub__</p>
    </header>

    <section class="card">
      <h2>__MSG_sectionApi__</h2>
      <div class="field">
        <label for="endpoint">__MSG_labelEndpoint__ <span class="hint">__MSG_endpointHintInline__</span></label>
        <input id="endpoint" type="text" spellcheck="false" placeholder="https://api.deepseek.com" />
        <p class="hint">__MSG_endpointAutoHint__</p>
      </div>
      <div class="field">
        <label for="apiKey">__MSG_labelApiKey__</label>
        <div class="keywrap">
          <input id="apiKey" type="password" spellcheck="false" placeholder="sk-..." autocomplete="off" />
          <button type="button" id="toggleKey" class="ghost">__MSG_msgShow__</button>
        </div>
      </div>
      <div class="field">
        <label for="model">__MSG_labelModel__</label>
        <input id="model" type="text" spellcheck="false" placeholder="deepseek-chat" />
      </div>
      <div class="field">
        <button type="button" id="testBtn" class="ghost">__MSG_testBtn__</button>
        <span id="testStatus" class="test-status"></span>
      </div>
      <details class="providers">
        <summary>__MSG_providersSummary__</summary>
        <pre>__MSG_providersList__</pre>
      </details>
    </section>

    <section class="card">
      <h2>__MSG_sectionQuestion__</h2>
      <div class="field">
        <label for="questionLabel">__MSG_labelButtonText__</label>
        <input id="questionLabel" type="text" maxlength="6" placeholder="?" />
      </div>
      <div class="field">
        <label for="questionPrompt">__MSG_labelPrompt__</label>
        <textarea id="questionPrompt" rows="5" spellcheck="false"></textarea>
        <p class="hint">__MSG_promptHintHtml__</p>
      </div>
      <div class="field">
        <label for="contextQuestionPrompt">__MSG_labelContextQuestionPrompt__</label>
        <textarea id="contextQuestionPrompt" rows="5" spellcheck="false"></textarea>
        <p class="hint">__MSG_contextQuestionHint__</p>
      </div>
    </section>

    <section class="card">
      <h2>__MSG_sectionTranslate__</h2>
      <div class="field">
        <label for="translateLabel">__MSG_labelButtonText__</label>
        <input id="translateLabel" type="text" maxlength="6" placeholder="译" />
      </div>
      <div class="field">
        <label for="translatePrompt">__MSG_labelPrompt__</label>
        <textarea id="translatePrompt" rows="5" spellcheck="false"></textarea>
        <p class="hint">__MSG_promptHintHtml__</p>
      </div>
      <div class="field">
        <label for="contextTranslatePrompt">__MSG_labelContextTranslatePrompt__</label>
        <textarea id="contextTranslatePrompt" rows="5" spellcheck="false"></textarea>
        <p class="hint">__MSG_contextTranslateHint__</p>
      </div>
    </section>

    <div class="footer">
      <button type="button" id="saveBtn" class="primary">__MSG_saveBtn__</button>
      <button type="button" id="resetBtn" class="ghost">__MSG_resetBtn__</button>
      <span id="saveStatus" class="test-status"></span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
